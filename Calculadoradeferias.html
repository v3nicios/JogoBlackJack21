<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Férias CLT 2026</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 550px; }
        h2 { color: #2c3e50; text-align: center; border-bottom: 3px solid #27ae60; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 0.85rem; color: #555; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .full-width { grid-column: span 2; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; background: #f9f9f9; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .checkbox-group input { width: auto; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        button { width: 100%; padding: 15px; background-color: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #1e8449; }
        #controle { background-color: #34495e; font-size: 1rem; }
        #controle:hover { background-color: #2c3e50; }
        .result { margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #ddd; border-radius: 8px; display: none; }
        .result-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .total { font-size: 1.3rem; color: #27ae60; font-weight: bold; border-top: 2px solid #27ae60; margin-top: 10px; }
        .negativo { color: #e74c3c; }
        .total-descontos { font-weight: bold; color: #c0392b; border-top: 1px dashed #ccc; padding-top: 10px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Férias 2026 (Regra de isenção dos R$ 5k)</h2>
    
    <div class="grid">
        <div class="form-group">
            <label>Salário Bruto (R$):</label>
            <input type="number" id="salario" placeholder="0.00">
        </div>
        <div class="form-group">
            <label>Meses Trabalhados (1 a 12):</label>
            <input type="number" id="meses" value="12" max="12">
        </div>
        <div class="form-group">
            <label>Faltas Injustificadas:</label>
            <input type="number" id="faltas" value="0">
        </div>
        <div class="form-group">
            <label>Dependentes:</label>
            <input type="number" id="dependentes" value="0">
        </div>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="abono">
        <label for="abono">Vender 1/3 das férias (Abono Pecuniário)</label>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="adiantamento13">
        <label for="adiantamento13">Adiantar 1ª parcela do 13º salário</label>
    </div>

    <div class="btn-group">
        <button onclick="calcularFerias2026()">Calcular Férias Líquidas</button>
        <button id="controle" onclick="window.location.href='Saque-aniversario.html'">Calculadora Saque-aniversário</button>
    </div>

    <div id="resultado" class="result">
        <div class="result-row"><span>Dias de Direito:</span> <span id="res-dias"></span></div>
        <div class="result-row"><span>Valor das Férias:</span> <span id="res-ferias"></span></div>
        <div class="result-row"><span>1/3 Constitucional:</span> <span id="res-terco"></span></div>
        <div id="row-abono" class="result-row" style="color: #2980b9;"><span>Abono Pecuniário (Isento):</span> <span id="res-abono"></span></div>
        <div id="row-13" class="result-row" style="color: #8e44ad;"><span>1ª Parcela 13º Salário:</span> <span id="res-13"></span></div>
        
        <div class="result-row negativo"><span>INSS:</span> <span id="res-inss"></span></div>
        <div class="result-row negativo"><span>IRRF (com Redutor 2026):</span> <span id="res-irrf"></span></div>
        <div class="result-row total-descontos"><span>Total de Descontos:</span> <span id="res-total-descontos"></span></div>
        
        <div class="result-row total"><span>Total Líquido a Receber:</span> <span id="res-total"></span></div>
    </div>
</div>

<script>
    function calcularFerias2026() {
        const salario = parseFloat(document.getElementById('salario').value) || 0;
        const meses = parseInt(document.getElementById('meses').value) || 0;
        const faltas = parseInt(document.getElementById('faltas').value) || 0;
        const dependentes = parseInt(document.getElementById('dependentes').value) || 0;
        const querAbono = document.getElementById('abono').checked;
        const quer13 = document.getElementById('adiantamento13').checked;

        if (salario <= 0) { alert("Informe o salário!"); return; }

        // 1. Calcular Dias de Direito (Tabela CLT)
        let diasDireito = 30;
        if (faltas > 5 && faltas <= 14) diasDireito = 24;
        else if (faltas > 14 && faltas <= 23) diasDireito = 18;
        else if (faltas > 23 && faltas <= 32) diasDireito = 12;
        else if (faltas > 32) diasDireito = 0;

        // Proporcionalidade pelos meses trabalhados
        diasDireito = (diasDireito / 12) * meses;

        // 2. Valores Base
        let diasParaGozar = querAbono ? (diasDireito * (2/3)) : diasDireito;
        let diasParaVender = querAbono ? (diasDireito * (1/3)) : 0;

        const valorGozado = (salario / 30) * diasParaGozar;
        const tercoGozado = valorGozado / 3;
        
        const valorVendido = (salario / 30) * diasParaVender;
        const tercoVendido = valorVendido / 3;
        const totalAbonoIndenizado = valorVendido + tercoVendido;

        // Adiantamento 13º (50% do salário bruto - sem descontos nesta etapa)
        const valor13 = quer13 ? (salario / 2) : 0;

        // 3. Descontos (Somente sobre férias gozadas + 1/3)
        const baseImposto = valorGozado + tercoGozado;
        
        // Tabela INSS 2026 (Estimada com teto de R$ 8.150,00)
        let inss = calcularINSS(baseImposto);

        // Tabela IRRF 2026 (Sua Tabela + Redutor)
        const baseIRRF = baseImposto - inss - (dependentes * 189.59);
        let irrf = calcularIRRF2026(baseIRRF);

        // Soma dos Descontos
        const totalDescontos = inss + irrf;

        // Cálculo do Total Líquido
        const totalLiquido = baseImposto - totalDescontos + totalAbonoIndenizado + valor13;

        // Exibição
        const fmt = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('res-dias').innerText = diasDireito.toFixed(0) + " dias";
        document.getElementById('res-ferias').innerText = fmt(valorGozado);
        document.getElementById('res-terco').innerText = fmt(tercoGozado);
        
        document.getElementById('res-abono').innerText = fmt(totalAbonoIndenizado);
        document.getElementById('row-abono').style.display = querAbono ? 'flex' : 'none';

        document.getElementById('res-13').innerText = fmt(valor13);
        document.getElementById('row-13').style.display = quer13 ? 'flex' : 'none';

        document.getElementById('res-inss').innerText = "- " + fmt(inss);
        document.getElementById('res-irrf').innerText = "- " + fmt(irrf);
        document.getElementById('res-total-descontos').innerText = "- " + fmt(totalDescontos);
        
        document.getElementById('res-total').innerText = fmt(totalLiquido);
        
        document.getElementById('resultado').style.display = 'block';
    }

    function calcularINSS(base) {
        let imposto = 0;
        const faixas = [
            {limite: 1518.00, aliq: 0.075},
            {limite: 2800.00, aliq: 0.09},
            {limite: 4200.00, aliq: 0.12},
            {limite: 8150.00, aliq: 0.14}
        ];
        let tAnterior = 0;
        for (let f of faixas) {
            if (base > f.limite) {
                imposto += (f.limite - tAnterior) * f.aliq;
                tAnterior = f.limite;
            } else {
                imposto += (base - tAnterior) * f.aliq;
                return imposto;
            }
        }
        return imposto;
    }

    function calcularIRRF2026(base) {
        let impostoTradicional = 0;
        
        if (base <= 2428.80) impostoTradicional = 0;
        else if (base <= 2826.65) impostoTradicional = (base * 0.075) - 182.16;
        else if (base <= 3751.05) impostoTradicional = (base * 0.15) - 394.16;
        else if (base <= 4664.68) impostoTradicional = (base * 0.225) - 675.49;
        else impostoTradicional = (base * 0.275) - 908.73;

        let redutor = 0;
        if (base <= 5000) {
            redutor = 312.89;
        } else if (base <= 7350) {
            redutor = 978.62 - (0.133145 * base);
        }

        let impostoFinal = impostoTradicional - redutor;
        return impostoFinal > 0 ? impostoFinal : 0;
    }
</script>
</body>
</html>
