<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Saque-Aniversário Projetada 2026</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #1a73e8; text-align: center; margin-top: 0; }
        .input-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #444; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 14px; background-color: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #1557b0; }
        .result { margin-top: 1.5rem; padding: 1.2rem; background-color: #f8f9fa; border-left: 5px solid #1a73e8; border-radius: 4px; display: none; }
        .result p { margin: 8px 0; font-size: 0.95rem; }
        .total-highlight { color: #d93025; font-size: 1.3rem; font-weight: bold; }
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }
    </style>
</head>
<body>
<button onclick="window.location.href='Calculadoradeferias.html'">Voltar ao Jogo</button>

<div class="container">
    <h2>Projeção Saque 2026</h2>
    
    <div class="input-group">
        <label>Saldo Atual do FGTS (R$):</label>
        <input type="number" id="saldoAtual" placeholder="Quanto você tem hoje">
    </div>

    <div class="input-group">
        <label>Salário Bruto Mensal (R$):</label>
        <input type="number" id="salario" placeholder="Para calcular os 8%">
    </div>

    <div class="input-group">
        <label>Mês do seu Aniversário:</label>
        <select id="mesAniversario">
            <option value="0">Janeiro</option><option value="1">Fevereiro</option>
            <option value="2">Março</option><option value="3">Abril</option>
            <option value="4">Maio</option><option value="5">Junho</option>
            <option value="6">Julho</option><option value="7">Agosto</option>
            <option value="8">Setembro</option><option value="9">Outubro</option>
            <option value="10">Novembro</option><option value="11">Dezembro</option>
        </select>
    </div>

    <button onclick="calcularProjecao()">Calcular Saque Estimado</button>

    <div id="resultado" class="result">
        <p>Meses até o aniversário: <strong id="res-meses"></strong></p>
        <p>Projeção de depósitos: <strong id="res-depositos"></strong></p>
        <p>Saldo estimado no mês: <strong id="res-saldo-final"></strong></p>
        <hr>
        <p>Alíquota: <span id="res-aliquota"></span> | Parcela: <span id="res-parcela"></span></p>
        <p>Estimativa de Saque:</p>
        <div id="res-saque-final" class="total-highlight"></div>
    </div>
</div>

<script>
    function calcularProjecao() {
        const saldoAtual = parseFloat(document.getElementById('saldoAtual').value) || 0;
        const salario = parseFloat(document.getElementById('salario').value) || 0;
        const mesAniver = parseInt(document.getElementById('mesAniversario').value);
        
        const dataAtual = new Date();
        const mesAtual = dataAtual.getMonth(); // 0 a 11
        
        // Calcula quantos meses faltam (se o mês já passou, conta para o ano que vem)
        let mesesFaltantes = mesAniver - mesAtual;
        if (mesesFaltantes < 0) mesesFaltantes += 12;

        // Cálculo do depósito mensal (8%)
        const depositoMensal = salario * 0.08;
        const totalDepositos = depositoMensal * mesesFaltantes;
        const saldoProjetado = saldoAtual + totalDepositos;

        // Lógica da Tabela de Cálculo
        let aliquota = 0;
        let parcela = 0;

        if (saldoProjetado <= 500) { aliquota = 0.50; parcela = 0; }
        else if (saldoProjetado <= 1000) { aliquota = 0.40; parcela = 50; }
        else if (saldoProjetado <= 5000) { aliquota = 0.30; parcela = 150; }
        else if (saldoProjetado <= 10000) { aliquota = 0.20; parcela = 650; }
        else if (saldoProjetado <= 15000) { aliquota = 0.15; parcela = 1150; }
        else if (saldoProjetado <= 20000) { aliquota = 0.10; parcela = 1900; }
        else { aliquota = 0.05; parcela = 2900; }

        const valorSaque = (saldoProjetado * aliquota) + parcela;

        document.getElementById('res-meses').innerText = mesesFaltantes;
        document.getElementById('res-depositos').innerText = totalDepositos.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('res-saldo-final').innerText = saldoProjetado.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('res-aliquota').innerText = (aliquota * 100) + "%";
        document.getElementById('res-parcela').innerText = "R$ " + parcela;
        document.getElementById('res-saque-final').innerText = valorSaque.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        document.getElementById('resultado').style.display = 'block';
    }
</script>

</body>
</html>
