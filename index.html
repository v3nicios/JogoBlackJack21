<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKJACK 21</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=New+Rocker&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <link rel="icon" href="images\favicon.ico" type="icon">
</head>

<body>
    <!-- <img src="images/QRCode_Fácil.svg" id="qrcode"> -->
    <h1>BLACKJACK 21</h1>

    <div id="area-jogo">
        <div id="area-dealer">
            <h2>Dealer/Casa: <span id="pontuacao-dealer"></span></h2>
            <div id="cartas-dealer" class="area-cartas">
            </div>
        </div>

        <div id="area-jogador">
            <div id="mao-1-container" class="mao-container">
                <h2>Mão : <span id="pontuacao-jogador-1"></span></h2>
                <div id="cartas-jogador-1" class="area-cartas"></div>

            </div>

            <div id="mao-2-container" class="mao-container" hidden>
                <h2>Mão 2: <span id="pontuacao-jogador-2"></span></h2>
                <div id="cartas-jogador-2" class="area-cartas"></div>

            </div>
        </div>
        <div class="saldo">
            <h1>SALDO: <span id="saldojogador"></span></h1>
        </div>
        <div class="area-ficha">
            <div class="area-bet" id="area-bet-1">
              <button id="beti" class="fichinha"><span id="bet-jogador"></span></button>
            </div>
        </div>
        <div id="fichas">
            <button id="f05" class="fichinha">05</button>
            <button id="f10" class="fichinha">10</button>
            <button id="f20" class="fichinha">20</button>
            <button id="f50" class="fichinha">50</button>
            <button id="f100" class="fichinha">100</button>
        </div>

        <p id="mensagem-resultado"></p>
        <div id="acoes">
            <button id="btn-pedir">PEDIR </button>
            <button id="btn-parar">PARAR </button>
            <button id="bet">APOSTAR</button>
            <button id="dubliar">DUPLICAR</button>
            <button id="btn-dividir">DIVIDIR</button>
        </div>


    </div>


    <button id="btn-novo-jogo">JOGAR NOVAMENTE</button>
    <button id="teste">win de game</button>
    <audio id="somAposta" src="sound/clicksound.mp3" preload="auto"></audio>
    <audio id="somdeficha" src="sound/Kaching.mp3" preload="auto"></audio>
    <audio id="perdeu" src="sound/perdeumane.mp3" preload="auto"></audio>
    <audio id="venceu" src="sound/winning.mp3" preload="auto"></audio>
    <audio id="estouro" src="sound/damage.mp3" preload="auto"></audio>
    <audio id="smzinho" src="sound/euevc.mp3" preload="auto"></audio>
    </div>

   
   <button class="faq-button" onclick="window.location.href='help.html'">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512">
    <path
      d="M80 160c0-35.3 28.7-64 64-64h32c35.3 0 64 28.7 64 64v3.6c0 21.8-11.1 42.1-29.4 53.8l-42.2 27.1c-25.2 16.2-40.4 44.1-40.4 74V320c0 17.7 14.3 32 32 32s32-14.3 32-32v-1.4c0-8.2 4.2-15.8 11-20.2l42.2-27.1c36.6-23.6 58.8-64.1 58.8-107.7V160c0-70.7-57.3-128-128-128H144C73.3 32 16 89.3 16 160c0 17.7 14.3 32 32 32s32-14.3 32-32zm80 320a40 40 0 1 0 0-80 40 40 0 1 0 0 80z"
    ></path>
  </svg>
  <span class="tooltip">SOBRE NÓS</span>

</button>
<button id="btn-toggle-som">🔊</button>
 <script src="script.js"></script>
</body>

</html>
