<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKJACK 21</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=New+Rocker&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <link rel="icon" href="images\favicon.ico" type="icon">
</head>

<body>
    <!-- <img src="images/QRCode_Fácil.svg" id="qrcode"> -->
    <h1>BLACKJACK 21</h1>

    <div id="area-jogo">
        <div id="area-dealer">
            <h2>Dealer/Casa: <span id="pontuacao-dealer"></span></h2>
            <div id="cartas-dealer" class="area-cartas">
            </div>
        </div>

        <div id="area-jogador">
            <div id="mao-1-container" class="mao-container">
                <h2>Mão : <span id="pontuacao-jogador-1"></span></h2>
                <div id="cartas-jogador-1" class="area-cartas"></div>

            </div>

            <div id="mao-2-container" class="mao-container" hidden>
                <h2>Mão 2: <span id="pontuacao-jogador-2"></span></h2>
                <div id="cartas-jogador-2" class="area-cartas"></div>

            </div>
        </div>
        <div class="saldo">
            <h1>SALDO: <span id="saldojogador"></span></h1>
        </div>
        <div class="area-ficha">
            <div class="area-bet" id="area-bet-1">
              <button id="beti" class="fichinha"><span id="bet-jogador"></span></button>
            </div>
        </div>
        <div id="fichas">
            <button id="f05" class="fichinha">05</button>
            <button id="f10" class="fichinha">10</button>
            <button id="f20" class="fichinha">20</button>
            <button id="f50" class="fichinha">50</button>
            <button id="f100" class="fichinha">100</button>
        </div>

        <p id="mensagem-resultado"></p>
        <div id="acoes">
            <button id="btn-pedir">PEDIR </button>
            <button id="btn-parar">PARAR </button>
            <button id="bet">APOSTAR</button>
            <button id="dubliar">DUPLICAR</button>
            <button id="btn-dividir">DIVIDIR</button>
        </div>


    </div>


    <button id="btn-novo-jogo">JOGAR NOVAMENTE</button>
    <button id="teste">win de game</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
